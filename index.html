<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Faheem Kodi is a versatile Full Stack Developer who is passionate about crafting engaging digital experiences with Python and JavaScript."
    />
    <title>Faheem Kodi | Full Stack Developer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      .pdf-container {
        width: 100%;
        height: 100vh;
      }
      /* Hide iframe on mobile and show fallback */
      @media (max-width: 768px) {
        .pdf-container {
          display: none;
        }
        .fallback {
          display: block;
          text-align: center;
          margin: 20px;
          font-size: 1.1rem;
        }
      }
      .fallback {
        display: none;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- PDF Viewer for Desktop -->
    <div class="pdf-container">
      <iframe
        src="faheem_kodi_resume.pdf"
        title="Faheem Kodi Resume"
      ></iframe>
    </div>

    <!-- Fallback for Mobile -->
    <div class="fallback">
      <p>
        This PDF cannot be displayed on mobile. Please
        <a href="faheem_kodi_resume_v1.pdf" download>click here to download</a> the resume.
      </p>
    </div>
  </body>
</html>
