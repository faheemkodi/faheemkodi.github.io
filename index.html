<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Faheem Kodi is a versatile Full Stack Software Engineer who is passionate about crafting engaging digital experiences with Python and JavaScript."
    />
    <title>Faheem Kodi | Full Stack Developer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      .pdf-container {
        width: 100%;
        height: 100vh;
      }

      object,
      embed {
        width: 100%;
        height: 100%;
        border: none;
      }

      .fallback {
        text-align: center;
        padding: 20px;
        font-size: 1.1rem;
      }
    </style>
  </head>

  <body>
    <div class="pdf-container">
      <object
        data="faheemkodi.pdf"
        type="application/pdf"
      >
        <embed
          src="faheemkodi.pdf"
          type="application/pdf"
        />

        <div class="fallback">
          <p>
            Your browser can’t display this PDF.
            <br />
            <a href="faheemkodi.pdf" download>
              Click here to download
            </a>
          </p>
        </div>
      </object>
    </div>
  </body>
</html>
